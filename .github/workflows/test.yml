name: Test

on:
  push:
    branches: ["**"]
  pull_request:

# Silences deprecation warnings that Node based actions print (e.g. "punycode"); they are not ours to fix.
env:
  NODE_OPTIONS: --no-deprecation

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          # No module dependencies (no go.sum), so there is nothing to cache.
          cache: false
      - run: test -z "$(gofmt -l .)" || (gofmt -l . && exit 1)
      - run: go vet ./...
      - run: go test -race ./...
